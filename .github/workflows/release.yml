name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version from tag
        working-directory: seb-linux
        run: node -e "const tag='${{ github.ref_name }}'.split('/').pop().replace(/^v/,'');require('child_process').execSync('npm version '+tag+' --no-git-tag-version --allow-same-version',{stdio:'inherit'})"

      - name: Install dependencies
        working-directory: seb-linux
        run: npm ci

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: seb-linux
        run: npx electron-builder --linux --publish=never

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: seb-linux
        run: npx electron-builder --win --publish=never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: seb-linux
        run: npx electron-builder --mac --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: seb-linux/dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*

  verify-install:
    name: Verify Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run install script (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: Run install script (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1

      - name: Verify install (Linux)
        if: runner.os == 'Linux'
        run: |
          dpkg-query -W seb-linux
          test -x "/opt/Safe Exam Browser/seb-linux"

      - name: Verify install (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d "/Applications/Safe Exam Browser.app" \
            || test -d "$HOME/Applications/Safe Exam Browser.app"

      - name: Verify install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:LOCALAPPDATA\NSEB\NSEB.exe")) { exit 1 }
