name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tags may carry a non-semver version (e.g. v0.1.3.1). package.json only
      # accepts semver, so store the first three parts there and keep the full
      # tag as the artifact label.
      - name: Set version from tag
        working-directory: seb-linux
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const t=process.env.TAG.replace(/^v/,'');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=t.split('.').slice(0,3).join('.');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('version='+p.version+' label='+t)"

      - name: Install dependencies
        working-directory: seb-linux
        run: npm ci

      - name: Build (Linux)
        working-directory: seb-linux
        env:
          LABEL: ${{ github.ref_name }}
        run: |
          npx electron-builder --linux --publish=never \
            -c.artifactName="NSEB-v${LABEL#v}.\${ext}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: seb-linux/dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*

  verify-install:
    name: Verify Install (Linux)
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - name: Run install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: Verify install
        run: |
          dpkg-query -W seb-linux
          test -x "/opt/Safe Exam Browser/seb-linux"
