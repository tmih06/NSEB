name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version from tag
        working-directory: seb-linux
        run: node -e "const tag='${{ github.ref_name }}'.split('/').pop().replace(/^v/,'');require('child_process').execSync('npm version '+tag+' --no-git-tag-version --allow-same-version',{stdio:'inherit'})"

      - name: Install dependencies
        working-directory: seb-linux
        run: npm ci

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: seb-linux
        run: npx electron-builder --linux --publish=never

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: seb-linux
        run: npx electron-builder --win --publish=never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: seb-linux
        run: npx electron-builder --mac --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: seb-linux/dist/*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
