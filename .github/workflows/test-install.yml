name: Test Install Scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/test-install.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - '.github/workflows/test-install.yml'

permissions:
  contents: read

jobs:
  install:
    name: Install (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: Verify install
        run: |
          dpkg-query -W seb-linux
          test -x "/opt/Safe Exam Browser/seb-linux"
