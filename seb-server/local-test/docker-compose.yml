services:
  mariadb:
    image: mariadb:11.4
    container_name: seb-local-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: sebtestdb
      MARIADB_DATABASE: SEBServer
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - seb-local-mariadb-data:/var/lib/mysql

  seb-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seb-local-server
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      JAVA_HEAP_MIN: "256m"
      JAVA_HEAP_MAX: "1024m"
    ports:
      - "18080:8080"
    volumes:
      - ./config:/sebserver/config:ro

  exam-site:
    image: nginx:1.27-alpine
    container_name: seb-local-exam-site
    depends_on:
      seb-server:
        condition: service_started
    ports:
      - "18180:80"
    volumes:
      - ./test-exam:/usr/share/nginx/html:ro

volumes:
  seb-local-mariadb-data:
