# Local overrides must live in the active vertical profile so they are applied
# after the bundled ws/gui profile files from the classpath.
logging.level.ROOT=INFO
logging.level.ch=INFO

datastore.mariadb.server.address=mariadb
datastore.mariadb.server.port=3306
sebserver.mariadb.password=sebtestdb

sebserver.password=admin
sebserver.webservice.light.setup=true
sebserver.init.organisation.name=SEB Local Test
sebserver.init.adminaccount.username=admin
sebserver.init.adminaccount.init.pwd=admin

sebserver.webservice.http.external.scheme=http
sebserver.webservice.http.external.servername=localhost
sebserver.webservice.http.external.port=18080

sebserver.gui.http.external.scheme=http
sebserver.gui.http.external.servername=localhost
sebserver.gui.http.external.port=18080

sebserver.feature.exam.seb.screenProctoring.enabled=false
sebserver.feature.exam.seb.screenProctoring.bundled=false
sebserver.feature.exam.seb.liveProctoring.enabled=false
sebserver.feature.seb.liveProctoring.enabled=false

sps.sebserver.client.secret=local-sps-client-secret
sps.sebserver.password=local-sps-password

enable.swagger=true
